<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Remoto</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">ControlaMiPC</div>
        <div id="status" class="status disconnected">Desconectado</div>
    </header>
    <aside>
        <nav>
            <button data-view="mouse" class="active"><i class="fas fa-mouse"></i></button>
            <button data-view="keyboard"><i class="fas fa-keyboard"></i></button>
            <button data-view="commands"><i class="fas fa-terminal"></i></button>
        </nav>
    </aside>
    <main>
        <!-- Mouse View -->
        <section id="mouse" class="view active">
            <div class="control-group">
                <label>IP de la PC:</label>
                <input type="text" id="ip" placeholder="192.168.x.x:puerto">
            </div>
            <div class="control-group">
                <label>Sensibilidad: <span id="sensDisplay">1.0×</span></label>
                <input type="range" id="sensitivity" min="0.2" max="3" step="0.1" value="1">
            </div>
            <div id="touchpad" class="touchpad">
                <span>Desliza aquí</span>
            </div>
            <div class="buttons">
                <div class="control-group">
                  <select id="buttonType">
                    <option value="left">Izquierdo</option>
                    <option value="right">Derecho</option>
                    <option value="middle">Centro</option>
                  </select>
                  <label>
                    <input type="checkbox" id="doubleClickToggle" />
                    Doble Click
                  </label>
                  <button onclick="clickMouse()">Click</button>
                </div>
                <button onclick="scrollMouse()"><i class="fas fa-scroll"></i> Scroll</button>
                <button onclick="getPosition()"><i class="fas fa-crosshairs"></i> Posición</button>
            </div>
            <div id="position" class="output"></div>
        </section>
        <!-- Keyboard View -->
        <section id="keyboard" class="view hidden">
            <div class="control-group">
                <input type="text" id="textInput" placeholder="Escribe algo...">
                <button onclick="writeText()"><i class="fas fa-paper-plane"></i> Enviar</button>
            </div>
            <div class="control-group">
                <select id="keySelect">
                    <option value="LEFT">◀️ Izquierda</option>
                    <option value="RIGHT">▶️ Derecha</option>
                    <option value="RETURN">⏎ Enter</option>
                    <option value="ESCAPE">⎋ Esc</option>
                </select>
                <button onclick="pressKey()"><i class="fas fa-keyboard"></i> Presionar</button>
            </div>
        </section>
        <!-- Commands View -->
        <section id="commands" class="view hidden">
            <div class="chips">
                <button class="chip" onclick="sendCommand('open_chrome')">Abrir Chrome</button>
                <button class="chip" onclick="sendCommand('mute_audio')">Silenciar</button>
            </div>
            <div id="logConsole" class="console"></div>
        </section>
    </main>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="./scripts.js"></script>
</body>
</html>
